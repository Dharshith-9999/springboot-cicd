name: CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: checkout
              uses: actions/checkout@v4
            - name: setup java
              uses: actions/setup-java@v5
              with:
                distribution: temurin
                java-version: '21'
                cache: maven

            - name: tests
              run: ./mvnw test
            - name: build application
              run: ./mvnw clean package
              

