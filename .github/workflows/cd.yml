name: CD

on:
    workflow_run:
        workflows: ["CI"]
        types:
            - completed

permissions:
    id-token: write
    contents: read

jobs:

    Deployemt:
        if: ${{ github.event.workflow_run.conclusion == 'success'}}
        runs-on: ubuntu-latest
        steps:
            - name: CD Started
              run: echo "CI succeded and CD started"
            
            - name: Checkout source
              uses: actions/checkout@v4
              with:
                ref: ${{ github.event.workflow_run.head_sha }}

            - name: Download application artifact
              uses: actions/download-artifact@v4
              with:
                name: springboot-app
                github-token: ${{ secrets.GITHUB_TOKEN }}
                repository: ${{ github.repository }}
                run-id: ${{ github.event.workflow_run.id }}
                path: target

            - name: creat docker image
              run: |
                docker build -t springboot-cicd:${{ github.event.workflow_run.head_sha }} .
            - name: Configure aws credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                role-to-assume: arn:aws:iam::283609055440:role/GitHubActions-SpringBoot-Testing
                aws-region: us-east-1

            - name: verify aws credentias
              run: aws sts get-caller-identity
              
