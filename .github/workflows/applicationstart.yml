name: APPLICATION SPECIFIC

on:
    workflow_run:
        workflows: ["CD"]
        types:
            - completed
permissions:
    contents: read

jobs:
    deployandstart:
        if: ${{ github.event.workflow_run.conclusion == 'success'}}
        runs-on: ubuntu-latest

        steps:
            - name: configure ec2 authentication
              uses: appleboy/ssh-action@v1
              with:
                host: ${{ secrets.EC2_HOST }}
                username: ${{ secrets.EC2_USER }}
                key: ${{ secrets.EC2_SSH_KEY }}
                script: |
                    whoami
                    hostname

                    # Login to ECR from EC2
                    aws ecr get-login-password --region us-east-1 | \
                    docker login --username AWS --password-stdin \
                    283609055440.dkr.ecr.us-east-1.amazonaws.com

                    #pulling the docker image

                    docker pull 283609055440.dkr.ecr.us-east-1.amazonaws.com/springboot-cicd:${{ github.event.workflow_run.head_sha }}
                    docker images
